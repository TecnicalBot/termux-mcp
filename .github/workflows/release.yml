# Builds release binaries and creates a GitHub Release whenever a version
# tag (vX.Y.Z) is pushed:
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# Produces a release with auto-generated notes and one raw binary:
# android/arm64 (modern phones). Built for GOOS=android — required on
# Termux (see the build step for why).
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: # allow manual trigger for testing

permissions:
  contents: write # needed to create releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build release binaries
        run: |
          set -euo pipefail
          mkdir -p dist
          # IMPORTANT: build for GOOS=android, NOT linux. Go's stdlib only
          # activates Android seccomp workarounds (avoiding the faccessat2
          # syscall, which Android's seccomp policy kills with SIGSYS) when
          # runtime.GOOS == "android". A GOOS=linux build crashes on Termux
          # as soon as os/exec.LookPath is used.
          # arm64 is the only Android target that links without cgo/NDK
          # (android/arm and android/amd64 require external linking). 32-bit
          # devices fall back to the on-device source build in install.sh,
          # which works with Termux's clang.
          name="termux-mcp-${GITHUB_REF_NAME}-android-arm64"
          echo "building ${name} ..."
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath \
            -ldflags="-s -w -X termux-mcp/internal/version.Version=${GITHUB_REF_NAME}" \
            -o "dist/${name}" ./cmd/termux-mcp
          ls -la dist/

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Attach the raw binaries directly — the installer downloads them
          # as-is (no tarball needed; it already clones the repo for config
          # template and boot script).
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
